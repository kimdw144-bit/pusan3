<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>예금만으로 충분할까요? — 확인하기</title>
<style>
  :root{
    --bg:#f7f8fb; --card:#ffffff; --ink:#111827; --sub:#6b7280;
    --accent:#2f6fed; --accent-soft:#eaf1ff; --danger:#e2493d; --danger-soft:#fdeceb;
    --ok:#1c9d6b; --ok-soft:#e7f7f0; --info:#9a6b00; --info-soft:#fff6e0; --line:#e5e7eb;
    --series-1:#2a78d6; --series-2:#eb6834; --series-3:#1baf7a;
    --muted:#898781; --baseline:#c3c2b7; --gridline:#e1e0d9;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.55;
  }
  .wrap{max-width:640px; margin:0 auto; padding:40px 20px 80px;}
  a.back{color:var(--sub); font-size:14px; text-decoration:none;}
  h1{font-size:24px; margin:16px 0 6px;}
  p.desc{color:var(--sub); margin:0 0 24px;}

  .card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:22px; margin-bottom:16px;}
  .field-row{display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end;}
  .field{flex:1; min-width:130px;}
  label{display:block; font-size:13px; color:var(--sub); margin-bottom:6px;}
  select{
    width:100%; padding:10px 12px; font-size:15px; border:1px solid var(--line); border-radius:10px;
    background:#fff; color:var(--ink);
  }
  button#calcBtn{
    padding:11px 22px; font-size:15px; font-weight:700; background:var(--accent); color:#fff;
    border:none; border-radius:10px; cursor:pointer;
  }
  button#calcBtn:hover{opacity:.92;}

  .message{margin-top:14px; padding:12px 14px; border-radius:10px; font-size:14px; display:none;}
  .message:not(:empty){display:block;}
  .message.info{background:var(--info-soft); color:var(--info);}
  .message.error{background:var(--danger-soft); color:var(--danger);}

  #result{display:none; margin-top:18px;}
  .chart-card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px 18px 10px; margin-bottom:12px;}
  .chart-title{font-size:13px; color:var(--sub); margin-bottom:10px;}
  .legend{display:flex; gap:16px; flex-wrap:wrap; margin-bottom:6px; font-size:12.5px; color:var(--sub);}
  .legend span{display:inline-flex; align-items:center; gap:6px;}
  .legend i{width:9px; height:9px; border-radius:50%; display:inline-block;}
  .chart-scroll{overflow-x:auto;}
  .result-card{background:var(--accent-soft); border-radius:14px; padding:18px; margin-bottom:12px;}
  .result-title{font-size:13px; color:var(--sub); margin-bottom:6px;}
  .result-big{font-size:26px; font-weight:800; color:var(--ink);}
  .result-sub{font-size:13px; color:var(--sub); margin-top:4px;}
  .result-interpret{font-size:13.5px; color:var(--ink); margin-top:10px; padding-top:10px; border-top:1px solid rgba(0,0,0,.08); line-height:1.5;}
  .src{font-size:12px; color:var(--sub); margin-top:6px;}

  footer{margin-top:30px; font-size:12px; color:var(--sub);}
  footer .notice{background:var(--danger-soft); color:var(--danger); border-radius:8px; padding:8px 12px; display:inline-block; font-weight:600; margin-bottom:8px;}
</style>
</head>
<body>
<div class="wrap">
  <a href="./index.html" class="back">← 랜딩으로</a>
  <h1>예금만으로 충분할까요?</h1>
  <p class="desc">비교할 기간을 고르면 예금금리·물가상승률·한국 주가지수 데이터로 판단 신호를 보여드립니다.</p>

  <div class="card">
    <div class="field-row">
      <div class="field">
        <label for="startYear">시작 연도</label>
        <select id="startYear">
          <option value="">선택 안 함</option>
          <option value="2010">2010</option>
          <option value="2011">2011</option>
          <option value="2012">2012</option>
          <option value="2013">2013</option>
          <option value="2014">2014</option>
          <option value="2015">2015</option>
          <option value="2016">2016</option>
          <option value="2017">2017</option>
          <option value="2018">2018</option>
          <option value="2019">2019</option>
          <option value="2020">2020</option>
          <option value="2021" selected>2021</option>
          <option value="2022">2022</option>
          <option value="2023">2023</option>
          <option value="2024">2024</option>
          <option value="2025">2025</option>
        </select>
      </div>
      <div class="field">
        <label for="endYear">종료 연도</label>
        <select id="endYear">
          <option value="">선택 안 함</option>
          <option value="2010">2010</option>
          <option value="2011">2011</option>
          <option value="2012">2012</option>
          <option value="2013">2013</option>
          <option value="2014">2014</option>
          <option value="2015">2015</option>
          <option value="2016">2016</option>
          <option value="2017">2017</option>
          <option value="2018">2018</option>
          <option value="2019">2019</option>
          <option value="2020">2020</option>
          <option value="2021">2021</option>
          <option value="2022">2022</option>
          <option value="2023">2023</option>
          <option value="2024">2024</option>
          <option value="2025" selected>2025</option>
        </select>
      </div>
      <div class="field" style="flex:0 0 auto;">
        <button id="calcBtn">확인</button>
      </div>
    </div>
    <div id="message" class="message"></div>
  </div>

  <div id="result"></div>

  <footer>
    <div class="notice">수업 과제 데모 · 투자 판단 근거 아님</div>
    <p>예금금리·물가상승률: World Bank Open Data(CC BY 4.0) · 한국 주가지수: OECD Main Economic Indicators(SPASTT01KRA661N, 2015=100) · 특정 금융상품을 추천하지 않습니다.</p>
  </footer>
</div>

<script src="./data.js"></script>
<script src="./app.js"></script>
</body>
</html>
