<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>30초 송금 데모</title>
<style>body{margin:0;font-family:system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:#f2f4f6;color:#191f28}main{max-width:480px;margin:0 auto;padding:28px 20px}
a{color:#3182f6}.step{font-size:15px;color:#3182f6;font-weight:700}h1{font-size:28px;line-height:1.35;margin:8px 0 22px}.card{background:#fff;border-radius:20px;padding:22px}
input{width:100%;box-sizing:border-box;font-size:26px;padding:14px 4px;border:0;border-bottom:2px solid #3182f6;outline:0;background:none}.err{color:#f04452;font-size:16px;min-height:24px;margin-top:8px}
button{width:100%;margin-top:18px;padding:18px;border:0;border-radius:16px;background:#3182f6;color:#fff;font-size:20px;font-weight:700}.big{font-size:40px;font-weight:800;margin:6px 0}.muted{color:#6b7684;font-size:15px}.row{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid #f2f4f6}
[hidden]{display:none}</style>
<main><a href="index.html">← 소개로</a>
<section id="s1"><div class="step">1 / 3</div><h1>누구에게 보낼까요?</h1><div class="card"><input id="phone" inputmode="tel" placeholder="010-1234-5678"><div class="err" id="e1"></div></div><button id="b1">다음</button></section>
<section id="s2" hidden><div class="step">2 / 3</div><h1>얼마를 보낼까요?</h1><div class="card"><input id="amount" inputmode="numeric" placeholder="10,000"><div class="err" id="e2"></div></div><button id="b2">다음</button></section>
<section id="s3" hidden><div class="step">3 / 3</div><h1>비밀번호 4자리만 누르면 끝</h1><div class="card"><input id="pin" type="password" inputmode="numeric" maxlength="4" placeholder="••••"><div class="err" id="e3"></div></div><button id="b3">보내기</button></section>
<section id="done" hidden><h1>보냈어요 (데모)</h1><div class="card"><div class="muted" id="to"></div><div class="big" id="amt"></div><div class="row"><span>걸린 시간</span><b id="sec"></b></div><div class="row"><span>거친 단계</span><b>3단계</b></div><div class="row"><span>기존 방식</span><b id="before"></b></div></div>
<p class="muted" id="src"></p><p class="muted">교육용 데모 · 실제 송금·계좌 연결 없음 · 입력한 번호는 저장하지 않습니다</p></section>
</main><script src="data.js"></script><script src="app.js"></script><script>
const t0=Date.now();const $=id=>document.getElementById(id);let phone,amount;
function go(a,b){$(a).hidden=true;$(b).hidden=false;$(b).querySelector('input')?.focus()}
$('b1').onclick=()=>{const r=validatePhone($('phone').value);$('e1').textContent=r.ok?'':r.message;if(r.ok){phone=r.value;go('s1','s2')}};
$('b2').onclick=()=>{const r=validateAmount($('amount').value);$('e2').textContent=r.ok?'':r.message;if(r.ok){amount=r.value;go('s2','s3')}};
$('b3').onclick=()=>{const r=validatePin($('pin').value);$('e3').textContent=r.ok?'':r.message;if(!r.ok)return;const x=receipt(phone,amount,Math.max(1,Math.round((Date.now()-t0)/1000)));
$('to').textContent=x.to+' 님께';$('amt').textContent=x.amount;$('sec').textContent=x.seconds+'초';$('before').textContent='약 '+x.before+' (계좌번호·보안카드·공인인증서)';
$('src').textContent='기존 방식 출처: '+TRANSFER_FACTS.transfer_time_before.source+' ('+TRANSFER_FACTS.transfer_time_before.date+')';go('s3','done')};
</script></html>
