<!doctype html><html lang="ko"><meta charset="utf-8"><title>easy_transfer 테스트</title><body style="font-family:system-ui,sans-serif;padding:30px"><h1>30초 송금 데모 자동 검사</h1><ol id="out"></ol><p id="sum"></p>
<script src="data.js"></script><script src="app.js"></script><script>
const T=[];const t=(id,name,fn)=>{let ok=false;try{ok=fn()}catch(e){}T.push([id,name,ok])};
t('R-01','010-1234-5678 · 10,000 · 1234 → 완료 영수증',()=>{const p=validatePhone('010-1234-5678'),a=validateAmount('10,000'),k=validatePin('1234');const r=receipt(p.value,a.value,12);return p.ok&&a.ok&&k.ok&&r.to==='010-1234-5678'&&r.amount==='10,000원'&&r.steps===3});
t('R-01','기존 방식 시간은 data.js 출처 값(2~3분)',()=>receipt('01012345678',1,5).before==='2~3분');
t('R-02','빈칸이면 칸마다 안내',()=>validatePhone('').message==='받는 사람 전화번호를 입력하세요'&&validateAmount('').message==='보낼 금액을 입력하세요'&&validatePin('').message==='비밀번호 4자리를 입력하세요');
t('R-03','짧은 번호·문자 번호 안내',()=>['010-123','공일공','011-1234-5678'].every(v=>{const r=validatePhone(v);return !r.ok&&r.message==='전화번호는 010으로 시작하는 11자리 숫자예요'}));
t('R-03','음수·0·200만 원 초과 안내',()=>['-500','0','2000001','만원'].every(v=>{const r=validateAmount(v);return !r.ok&&r.message==='금액은 1원~200만 원 사이 숫자로 입력하세요'}));
t('R-03','비밀번호 3자리·문자 안내',()=>['123','12a4'].every(v=>{const r=validatePin(v);return !r.ok&&r.message==='비밀번호는 숫자 4자리예요'}));
document.getElementById('out').innerHTML=T.map(([i,n,o])=>`<li style="color:${o?'green':'red'}">${o?'PASS':'FAIL'} · ${i} · ${n}</li>`).join('');
document.getElementById('sum').textContent=`${T.filter(x=>x[2]).length}/${T.length} 통과`;
</script></body></html>
